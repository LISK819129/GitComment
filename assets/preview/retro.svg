<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Comments">
<defs>
<linearGradient id="rbar" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8fb2d8"/><stop offset="1" stop-color="#4d7cb0"/>
</linearGradient>
<style>
.h { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 17px; font-weight: 700; fill: #08172b; }
.sub { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 11px; fill: #08172b; }
.nav { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 11.5px; fill: #123d84; }
.navh { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #0e1d31; }
.who { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #123d84; }
.date { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 10px; fill: #4d6a8c; }
.msg { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 11.5px; fill: #0e1d31; }
.dim { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 11.5px; fill: #4d6a8c; }
.tick { font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: 700; fill: #7dff7d; letter-spacing: 2px; }
.foot { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #0e1d31; }
.small { font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; font-size: 9.5px; fill: #4d6a8c; }
</style>
</defs>
<rect x="10" y="10" width="860" height="280" fill="#c8d8ea" stroke="#1d3452" stroke-width="2"/>
